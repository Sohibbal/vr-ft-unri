<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tour – Fakultas Teknik Informatika UNRI</title>
    <meta name="description"
        content="Jelajahi kampus Fakultas Teknik Informatika Universitas Riau secara virtual 360° seperti Google Street View.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Scene Data -->
    <script src="data/scene.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         LOADING SCREEN
    ================================= -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <div class="logo-ring"></div>
                <div class="logo-ring ring-2"></div>
                <div class="logo-inner">
                    <span>360°</span>
                </div>
            </div>
            <h1 class="loading-title">Virtual Tour</h1>
            <p class="loading-subtitle">Fakultas Teknik Informatika<br><strong>Universitas Riau</strong></p>
            <div class="loading-bar-wrap">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <p class="loading-hint" id="loadingHint">Memuat aset panorama...</p>
        </div>
    </div>

    <!-- ==============================
         A-FRAME SCENE
    ================================= -->
    <a-scene id="aScene" vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true"
        loading-screen="enabled: false">

        <!-- ASSETS PRELOADER -->
        <a-assets id="aAssets" timeout="30000">
        </a-assets>

        <!-- CAMERA -->
        <a-entity id="cameraRig" position="0 0 0">
            <a-entity id="camera" camera look-controls="pointerLockEnabled: false; reverseMouseDrag: false"
                position="0 1.6 0" wasd-controls="enabled: false">
                <a-cursor id="cursor" color="#00D4FF" fuse="false" raycaster="objects: .clickable"
                    animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
                    animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03">
                </a-cursor>
            </a-entity>
        </a-entity>

        <!-- SKY 360 -->
        <a-sky id="sky" radius="500"></a-sky>

        <!-- AMBIENT LIGHT -->
        <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>

    </a-scene>

    <!-- ==============================
         HUD OVERLAY
    ================================= -->
    <div id="hud" class="hud">

        <!-- TOP BAR -->
        <div class="hud-top">
            <div class="hud-brand">
                <div class="brand-badge">360°</div>
                <div class="brand-info">
                    <span class="brand-name">Virtual Tour</span>
                    <span class="brand-sub">Teknik Informatika · UNRI</span>
                </div>
            </div>
            <div class="hud-actions">
                <button id="btnVR" class="hud-btn" title="Mode VR">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="8" width="20" height="8" rx="4" />
                        <circle cx="8.5" cy="12" r="1.5" />
                        <circle cx="15.5" cy="12" r="1.5" />
                        <line x1="12" y1="12" x2="12" y2="12" />
                    </svg>
                </button>
                <button id="btnFullscreen" class="hud-btn" title="Layar Penuh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                    </svg>
                </button>
                <button id="btnGyro" class="hud-btn" title="Gyroscope">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- SCENE INFO -->
        <div class="scene-info" id="sceneInfo">
            <div class="scene-dot-wrap" id="sceneDots"></div>
            <div class="scene-meta">
                <h2 class="scene-label" id="sceneLabel">Gerbang Utama</h2>
                <p class="scene-desc" id="sceneDesc">Pintu masuk Fakultas Teknik Informatika UNRI</p>
            </div>
            <div class="scene-counter">
                <span id="sceneNum">1</span><span class="sep">/</span><span id="sceneTotal">4</span>
            </div>
        </div>

        <!-- HINT DRAG -->
        <div class="drag-hint" id="dragHint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
                <path d="M9 11V6.5a1.5 1.5 0 0 1 3 0V11" />
                <path d="M12 11V5.5a1.5 1.5 0 0 1 3 0V11" />
                <path d="M15 11V7.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V11a1.5 1.5 0 0 1 3 0" />
            </svg>
            Seret untuk melihat sekitar
        </div>

        <!-- THUMBNAIL STRIP -->
        <div class="thumb-strip" id="thumbStrip"></div>

        <!-- NAVIGATION -->
        <div class="nav-controls">
            <button id="btnPrev" class="nav-btn nav-prev" title="Lokasi Sebelumnya" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
                <span>Sebelumnya</span>
            </button>

            <div class="nav-compass" id="navCompass">
                <div class="compass-ring">
                    <div class="compass-needle"></div>
                    <span class="compass-n">N</span>
                </div>
            </div>

            <button id="btnNext" class="nav-btn nav-next" title="Lokasi Berikutnya">
                <span>Berikutnya</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </button>
        </div>

    </div>

    <!-- FADE OVERLAY for transitions -->
    <div id="fadeOverlay" class="fade-overlay"></div>

    <script src="app.js"></script>

</body>

</html>
